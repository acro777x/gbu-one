name: Worker cron (notices)

on:
  schedule:
    # GitHub Actions cron is UTC-only (there is no timezone field), so the
    # 07:00-22:00 IST window is expressed in UTC as 01:30-16:30 UTC.
    # Every expression sits on the quarter-hour grid (:00 / :15 / :30 / :45),
    # so the schedule has no drift and no unscheduled hole.
    - cron: '30,45 1 * * *'          # 01:30, 01:45 UTC   = 07:00, 07:15 IST
    - cron: '0,15,30,45 2-15 * * *'  # 02:00-15:45 UTC   = 07:30-21:15 IST
    - cron: '0,15,30 16 * * *'       # 16:00, 16:15, 16:30 UTC = 21:30, 21:45, 22:00 IST
    # Outside the window: hourly, on the same quarter-hour grid.
    - cron: '30 17-23,0 * * *'       # 17:30-00:30 UTC   = 23:00-06:00 IST
  workflow_dispatch:

# Two 15-minute runs can never overlap: the second one queues behind the first
# instead of racing it on the same snapshot rows.
concurrency:
  group: worker-cron
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22.19.0 is the floor imposed by the dependency tree:
          #   * undici@8.12.3 declares "engines": { "node": ">=22.19.0" } and
          #     fails to LOAD on Node 20 (TypeError: Cannot read properties of
          #     undefined (reading 'bind') at lib/interceptor/decompress.js:78).
          #     The worker's fetchWithTlsTolerance() requires undici; when the
          #     require throws, the catch silently falls back to plain fetch and
          #     the two hosts with expired certificates (ohms.gbu.ac.in,
          #     digiforms.gbu.ac.in) then fail with CERT_HAS_EXPIRED on every
          #     run - 5 of 261 notices vanish silently.
          #   * @supabase/supabase-js@2.118.0 throws "Node.js detected but native
          #     WebSocket not found." from createClient() on Node < 22, and the
          #     worker's getWorkerSupabase() calls it OUTSIDE its try/catch, so
          #     the worker would exit 1 as soon as the Supabase secrets exist.
          node-version: '22.19.0'
          cache: npm
      - run: npm ci || npm install
      - name: Guard - the runtime must be able to load undici and @supabase/supabase-js
        run: |
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 19)) {
              throw new Error("Node >= 22.19.0 required (undici engines), got " + process.versions.node);
            }
            if (typeof WebSocket !== "function") {
              throw new Error("global WebSocket is missing - @supabase/supabase-js cannot create a client");
            }
            require("undici");
            require("@supabase/supabase-js");
            console.log("runtime ok:", process.version, "| WebSocket:", typeof WebSocket);
          '
      - name: Install Tesseract (OCR for scanned notices)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
          tesseract --version
      - name: Build the worker with the repo's own TypeScript
        run: |
          # tsx is NOT a dependency of this repo, so `npx tsx` used to download it
          # from npm on every scheduled run. The repo already ships TypeScript in
          # devDependencies (pinned in package-lock.json), so the worker is
          # compiled with that instead: no npm download at run time, no unpinned
          # package, and a missing compiler fails loudly instead of silently.
          test -f node_modules/typescript/bin/tsc || { echo "::error::TypeScript is not installed - 'npm ci' must install devDependencies"; exit 1; }
          node ./node_modules/typescript/bin/tsc worker/run.ts \
            --outDir dist \
            --rootDir . \
            --module commonjs \
            --moduleResolution node \
            --target es2022 \
            --lib es2022,dom \
            --esModuleInterop \
            --allowSyntheticDefaultImports \
            --resolveJsonModule \
            --skipLibCheck \
            --strict \
            --noCheck
      - name: Run notices worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          OCR_PROVIDER: tesseract
        run: node dist/worker/run.js
