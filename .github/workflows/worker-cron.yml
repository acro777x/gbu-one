name: Worker cron (notices)

on:
  schedule:
    # Every 15 minutes during 07:00-22:00 IST (01:30-16:30 UTC), hourly otherwise.
    - cron: '*/15 1-16 * * *'
    - cron: '7 17-23,0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Run notices worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          OCR_PROVIDER: tesseract
          WORKER_CONTACT_EMAIL: ${{ secrets.WORKER_CONTACT_EMAIL }}
        run: npx tsx worker/run.ts
